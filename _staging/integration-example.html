<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Scheduler Integration Example</title>
    
    <!-- Include the existing styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="prayer-scheduler.css">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Cinzel:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Simple header -->
    <header style="text-align: center; padding: 2rem; background: rgba(255,215,0,0.1); margin-bottom: 2rem;">
        <h1 style="color: var(--primary-gold); font-family: 'Cinzel', serif;">
            <i class="fas fa-praying-hands"></i> 
            Prayer Scheduler Integration
        </h1>
        <p style="color: rgba(255,255,255,0.9); margin-top: 1rem;">
            This page demonstrates how the Prayer Scheduler integrates with your existing website.
        </p>
    </header>

    <!-- The Prayer Scheduler will automatically insert itself here -->
    <!-- No manual HTML needed - it's all handled by JavaScript -->

    <!-- Simple footer -->
    <footer style="text-align: center; padding: 2rem; margin-top: 3rem; border-top: 1px solid rgba(255,215,0,0.3);">
        <p style="color: rgba(255,255,255,0.7);">
            Prayer Scheduler automatically integrates with your existing content.
        </p>
    </footer>

    <!-- Include the scripts -->
    <script src="script.js"></script>
    <script src="prayer-scheduler.js"></script>
    
    <!-- Simple demo script -->
    <script>
        // Show a welcome message when the scheduler loads
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                if (window.prayerScheduler) {
                    console.log('✅ Prayer Scheduler successfully integrated!');
                    
                    // Show a notification
                    if (typeof showNotification === 'function') {
                        showNotification('Prayer Scheduler loaded successfully! 🙏', 'success');
                    }
                }
            }, 3000);
        });
    </script>
</body>
</html>
