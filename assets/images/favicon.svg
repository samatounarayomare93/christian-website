<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <circle cx="256" cy="256" r="240" fill="#2E0854" stroke="#FFD700" stroke-width="10" />
  
  <g filter="url(#glow)">
    <!-- Vertical Bar -->
    <rect x="226" y="100" width="60" height="312" rx="5" fill="url(#goldGradient)" />
    <!-- Horizontal Bar -->
    <rect x="130" y="196" width="252" height="60" rx="5" fill="url(#goldGradient)" />
  </g>
  
  <!-- Inner Glow/Highlight -->
  <path d="M256 16 C 388.5 16 496 123.5 496 256" stroke="rgba(255,215,0,0.3)" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
